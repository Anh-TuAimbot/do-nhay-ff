<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Độ Nhạy Free Fire</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e1e2f, #11111d); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #282a36; padding: 25px; border-radius: 12px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        h1 { color: #ffb86c; font-size: 20px; margin-bottom: 15px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #44475a; color: #fff; margin-bottom: 12px; font-size: 15px; outline: none; }
        input:focus { border-color: #ff79c6; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #ff79c6; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #ff92d0; }
        .result { margin-top: 20px; padding: 15px; background: #343746; border-radius: 8px; display: none; text-align: left; }
        .item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #44475a; font-size: 14px; }
        .val { color: #50fa7b; font-weight: bold; }
        .highlight { background: #44475a; padding: 8px; border-radius: 6px; margin-top: 8px; border: none; }
        .dpi-box { background: #ffb86c; color: #1e1e2f; padding: 8px; border-radius: 6px; margin-top: 8px; font-weight: bold; border: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>ĐỘ NHẠY FREE FIRE</h1>
    <input type="text" id="dev" placeholder="Nhập tên máy (VD: iPhone 11, Redmi Note 10...)" onkeyup="if(event.key==='Enter') get()">
    <button onclick="get()">Lấy Cấu Hình</button>

    <div class="result" id="res">
        <h3 id="devName" style="color:#ffb86c; text-align:center; margin-bottom:12px; text-transform:uppercase;"></h3>
        <div class="item"><span>Nhìn xung quanh (0-200):</span><span class="val" id="v1"></span></div>
        <div class="item"><span>Red Dot Sight (0-200):</span><span class="val" id="v2"></span></div>
        <div class="item"><span>Ống ngắm 2x (0-200):</span><span class="val" id="v3"></span></div>
        <div class="item"><span>Ống ngắm 4x (0-200):</span><span class="val" id="v4"></span></div>
        <div class="item"><span>Ống ngắm AWM (0-200):</span><span class="val" id="v5"></span></div>
        <div class="item"><span>Góc nhìn (0-200):</span><span class="val" id="v6"></span></div>
        
        <div class="item highlight">
            <span>Nút bắn chuẩn (0-100):</span>
            <span class="val" style="color:#ff79c6; font-size: 16px;" id="vBtn"></span>
        </div>
        
        <div class="item dpi-box" id="dpiBox">
            <span>DPI Khuyên Dùng (Android):</span>
            <span id="vDpi" style="color:#bd93f9; font-size: 16px;"></span>
        </div>
    </div>
</div>

<script>
    function get() {
        var name = document.getElementById("dev").value.trim();
        if(!name) return alert("Vui lòng nhập tên thiết bị!");
        
        var isIOS = ["iphone","ipad","ip","apple"].some(k => name.toLowerCase().includes(k));
        var hash = 0;
        for (var i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        var calc = (min, max, offset) => Math.abs((hash + offset) % (max - min + 1)) + min;

        document.getElementById("devName").innerText = name;
        document.getElementById("v1").innerText = calc(170, 200, 1);
        document.getElementById("v2").innerText = calc(160, 195, 2);
        document.getElementById("v3").innerText = calc(150, 190, 3);
        document.getElementById("v4").innerText = calc(140, 185, 4);
        document.getElementById("v5").innerText = calc(90, 150, 5);
        document.getElementById("v6").innerText = calc(100, 180, 6);
        document.getElementById("vBtn").innerText = calc(40, 58, 7) + "%";

        var dpiBox = document.getElementById("dpiBox");
        if(isIOS) {
            dpiBox.style.display = "none";
        } else {
            dpiBox.style.display = "flex";
            document.getElementById("vDpi").innerText = calc(420, 600, 8);
        }
        document.getElementById("res").style.display = "block";
    }
</script>

</body>
</html>
